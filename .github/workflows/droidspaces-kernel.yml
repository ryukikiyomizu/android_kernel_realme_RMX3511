name: Build Droidspaces Kernel
on:
  push:
    branches: [stock]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc && sudo apt-get clean
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu python3 python-is-python3 cpio kmod lz4 xz-utils
      - name: Clone kernel
        run: git clone --depth 1 --branch stock https://github.com/rifsxd/android_kernel_realme_RMX3511.git kernel
      - name: Apply kABI patch for SYSVIPC
        working-directory: kernel
        run: |
          set -ex
          sed -i '0,/\tANDROID_KABI_RESERVE(1);/{s/\tANDROID_KABI_RESERVE(1);/\t_ANDROID_KABI_REPLACE(_ANDROID_KABI_RESERVE(1), struct sysv_sem sysvsem);/}' include/linux/sched.h
          grep -n "sysvsem" include/linux/sched.h
      - name: Modify defconfig
        working-directory: kernel
        run: |
          DC=arch/arm64/configs/sprd_sharkl5Pro_defconfig
          sed -i '/CONFIG_SYSVIPC/d;/CONFIG_POSIX_MQUEUE/d;/CONFIG_PID_NS/d;/CONFIG_IPC_NS/d;/CONFIG_USER_NS/d;/CONFIG_CGROUP_DEVICE/d;/CONFIG_CGROUP_PIDS/d;/CONFIG_CGROUP_NET_PRIO/d;/CONFIG_DEVTMPFS/d;/CONFIG_TMPFS_POSIX_ACL/d;/CONFIG_TMPFS_XATTR/d;/CONFIG_BRIDGE_NETFILTER/d;/CONFIG_NF_TABLES/d;/CONFIG_NETFILTER_XT_MATCH_ADDRTYPE/d' "$DC"
          # Disable broken SPRD PTM driver (missing trace header in source)
          sed -i 's/CONFIG_SPRD_PTM=y/# CONFIG_SPRD_PTM is not set/' "$DC"
          printf '\nCONFIG_SYSVIPC=y\nCONFIG_POSIX_MQUEUE=y\nCONFIG_PID_NS=y\nCONFIG_IPC_NS=y\nCONFIG_USER_NS=y\nCONFIG_CGROUP_DEVICE=y\nCONFIG_CGROUP_PIDS=y\nCONFIG_CGROUP_NET_PRIO=y\nCONFIG_DEVTMPFS=y\nCONFIG_TMPFS_POSIX_ACL=y\nCONFIG_TMPFS_XATTR=y\nCONFIG_BRIDGE_NETFILTER=y\nCONFIG_NF_TABLES=y\nCONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y\n' >> "$DC"
      - name: Build kernel
        working-directory: kernel
        run: |
          export ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- KCFLAGS="-Wno-error"
          make sprd_sharkl5Pro_defconfig
          echo "=== Critical configs ==="
          grep -E 'CONFIG_PID_NS|CONFIG_SYSVIPC|CONFIG_DEVTMPFS|CONFIG_POSIX_MQUEUE|CONFIG_IPC_NS|CONFIG_USER_NS|CONFIG_CGROUP_DEVICE' .config
          echo "=== Building kernel Image ==="
          make -j$(nproc) Image 2>&1 | tee /tmp/build.log | tail -5 || true
          echo "=== Build exit: ${PIPESTATUS[0]} ==="
          if [ -f arch/arm64/boot/Image ]; then
            echo "SUCCESS!"
            ls -la arch/arm64/boot/Image*
          else
            echo "FAILED - errors:"
            grep -i "error:" /tmp/build.log | head -20
            echo "--- last 50 lines ---"
            tail -50 /tmp/build.log
            exit 1
          fi
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: droidspaces-kernel-ums9230
          path: kernel/arch/arm64/boot/Image*
          if-no-files-found: error
          retention-days: 30