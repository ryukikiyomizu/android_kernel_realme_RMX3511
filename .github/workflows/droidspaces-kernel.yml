name: Build Droidspaces Kernel
on:
  push:
    branches: [stock]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc && sudo apt-get clean
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu python3 python-is-python3 cpio kmod lz4 xz-utils
      - name: Clone kernel
        run: git clone --depth 1 --branch stock https://github.com/rifsxd/android_kernel_realme_RMX3511.git kernel
      - name: Apply kABI patch for SYSVIPC
        working-directory: kernel
        run: |
          set -ex
          sed -i '0,/\tANDROID_KABI_RESERVE(1);/{s/\tANDROID_KABI_RESERVE(1);/\t_ANDROID_KABI_REPLACE(_ANDROID_KABI_RESERVE(1), struct sysv_sem sysvsem);/}' include/linux/sched.h
          grep -n "sysvsem" include/linux/sched.h
      - name: Use Tecno KL4 config with Droidspaces additions
        working-directory: kernel
        run: |
          set -ex
          echo "=== Using Tecno KL4 running kernel config as base ==="
          # Download the Tecno config we pushed to the repo root
          curl -fsSL -o .config "https://raw.githubusercontent.com/ryukikiyomizu/android_kernel_realme_RMX3511/stock/tecno_kl4_defconfig"
          wc -l .config

          echo "=== Enabling Droidspaces namespace configs ==="
          # Enable all missing configs
          sed -i 's/# CONFIG_SYSVIPC is not set/CONFIG_SYSVIPC=y/' .config
          sed -i 's/# CONFIG_POSIX_MQUEUE is not set/CONFIG_POSIX_MQUEUE=y/' .config
          sed -i 's/# CONFIG_PID_NS is not set/CONFIG_PID_NS=y/' .config
          sed -i 's/# CONFIG_IPC_NS is not set/CONFIG_IPC_NS=y/' .config
          sed -i 's/# CONFIG_USER_NS is not set/CONFIG_USER_NS=y/' .config
          sed -i 's/# CONFIG_CGROUP_DEVICE is not set/CONFIG_CGROUP_DEVICE=y/' .config
          sed -i 's/# CONFIG_CGROUP_PIDS is not set/CONFIG_CGROUP_PIDS=y/' .config
          sed -i 's/# CONFIG_DEVTMPFS is not set/CONFIG_DEVTMPFS=y/' .config

          # These might already be enabled or just missing
          grep -q "CONFIG_CGROUP_NET_PRIO" .config || echo "CONFIG_CGROUP_NET_PRIO=y" >> .config
          grep -q "CONFIG_TMPFS_POSIX_ACL" .config && sed -i 's/# CONFIG_TMPFS_POSIX_ACL is not set/CONFIG_TMPFS_POSIX_ACL=y/' .config || echo "CONFIG_TMPFS_POSIX_ACL=y" >> .config
          grep -q "CONFIG_TMPFS_XATTR" .config && sed -i 's/# CONFIG_TMPFS_XATTR is not set/CONFIG_TMPFS_XATTR=y/' .config || echo "CONFIG_TMPFS_XATTR=y" >> .config
          grep -q "CONFIG_BRIDGE_NETFILTER" .config && sed -i 's/# CONFIG_BRIDGE_NETFILTER is not set/CONFIG_BRIDGE_NETFILTER=y/' .config || echo "CONFIG_BRIDGE_NETFILTER=y" >> .config
          grep -q "CONFIG_NF_TABLES" .config && sed -i 's/# CONFIG_NF_TABLES is not set/CONFIG_NF_TABLES=y/' .config || echo "CONFIG_NF_TABLES=y" >> .config
          grep -q "CONFIG_NETFILTER_XT_MATCH_ADDRTYPE" .config && sed -i 's/# CONFIG_NETFILTER_XT_MATCH_ADDRTYPE is not set/CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y/' .config || echo "CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y" >> .config

          # Disable broken SPRD PTM driver
          sed -i 's/CONFIG_SPRD_PTM=y/# CONFIG_SPRD_PTM is not set/' .config

          echo "=== Resolve new dependencies with olddefconfig ==="
          export ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu-
          make olddefconfig

          echo "=== Verify critical configs ==="
          grep -E 'CONFIG_PID_NS|CONFIG_IPC_NS|CONFIG_USER_NS|CONFIG_SYSVIPC|CONFIG_POSIX_MQUEUE|CONFIG_DEVTMPFS|CONFIG_CGROUP_DEVICE' .config
      - name: Build kernel
        working-directory: kernel
        run: |
          export ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- KCFLAGS="-Wno-error"
          echo "=== Building kernel Image ==="
          make -j$(nproc) Image 2>&1 | tee /tmp/build.log | tail -5 || true
          echo "=== Build exit: ${PIPESTATUS[0]} ==="
          if [ -f arch/arm64/boot/Image ]; then
            echo "SUCCESS!"
            ls -la arch/arm64/boot/Image*
          else
            echo "FAILED - errors:"
            grep -i "error:" /tmp/build.log | head -20
            echo "--- last 50 lines ---"
            tail -50 /tmp/build.log
            exit 1
          fi
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: droidspaces-kernel-tecno-kl4
          path: kernel/arch/arm64/boot/Image*
          if-no-files-found: error
          retention-days: 30