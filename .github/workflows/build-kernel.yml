name: Build Droidspaces Kernel
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu python3 python-is-python3 cpio kmod lz4 xz-utils
      - name: Clone kernel
        run: git clone --depth 1 --branch stock https://github.com/rifsxd/android_kernel_realme_RMX3511.git kernel
      - name: Apply kABI patches manually
        working-directory: kernel
        run: |
          set -ex
          SCHED_H=include/linux/sched.h
          USER_H=include/linux/sched/user.h

          echo "=== SYSVIPC kABI: use KABI_RESERVE slots 1,2,3 for sysvsem ==="
          # In task_struct, replace KABI_RESERVE(1) with KABI_USE for sysvsem
          sed -i 's/ANDROID_KABI_RESERVE(1);/_ANDROID_KABI_REPLACE(_ANDROID_KABI_RESERVE(1), struct sysv_sem sysvsem);/' "$SCHED_H"
          
          # Verify the SYSVIPC section exists or add include
          grep -q "struct sysv_sem" "$SCHED_H" && echo "sysv_sem reference OK"
          
          echo "=== POSIX_MQUEUE kABI: use user_struct padding for mq fields ==="
          # In user.h, use KABI reserve for mq_bytes
          if grep -q "ANDROID_KABI_RESERVE" "$USER_H"; then
            sed -i 's/ANDROID_KABI_RESERVE(1);/_ANDROID_KABI_REPLACE(_ANDROID_KABI_RESERVE(1), unsigned long mq_bytes);/' "$USER_H"
          else
            echo "No KABI_RESERVE in user.h, trying direct approach..."
            # For kernels without KABI in user.h, just ensure the ifdef blocks are correct
            # The config option itself should handle the conditional compilation
          fi
          
          echo "=== Patches applied ==="
          grep -n "sysvsem\|KABI_REPLACE.*sysv\|mq_bytes" "$SCHED_H" "$USER_H" || true
      - name: Modify defconfig
        working-directory: kernel
        run: |
          DC=arch/arm64/configs/sprd_sharkl5Pro_defconfig
          sed -i '/CONFIG_SYSVIPC/d;/CONFIG_POSIX_MQUEUE/d;/CONFIG_PID_NS/d;/CONFIG_IPC_NS/d;/CONFIG_USER_NS/d;/CONFIG_CGROUP_DEVICE/d;/CONFIG_CGROUP_PIDS/d;/CONFIG_CGROUP_NET_PRIO/d;/CONFIG_DEVTMPFS/d;/CONFIG_TMPFS_POSIX_ACL/d;/CONFIG_TMPFS_XATTR/d;/CONFIG_BRIDGE_NETFILTER/d;/CONFIG_NF_TABLES/d;/CONFIG_NETFILTER_XT_MATCH_ADDRTYPE/d' "$DC"
          cat >> "$DC" << 'CONF'

# Droidspaces Container Support
CONFIG_SYSVIPC=y
CONFIG_POSIX_MQUEUE=y
CONFIG_PID_NS=y
CONFIG_IPC_NS=y
CONFIG_USER_NS=y
CONFIG_CGROUP_DEVICE=y
CONFIG_CGROUP_PIDS=y
CONFIG_CGROUP_NET_PRIO=y
CONFIG_DEVTMPFS=y
CONFIG_TMPFS_POSIX_ACL=y
CONFIG_TMPFS_XATTR=y
CONFIG_BRIDGE_NETFILTER=y
CONFIG_NF_TABLES=y
CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
CONF
          grep -E 'PID_NS|SYSVIPC|DEVTMPFS|POSIX_MQUEUE' "$DC"
      - name: Build
        working-directory: kernel
        run: |
          export ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- KCFLAGS="-Wno-error"
          make sprd_sharkl5Pro_defconfig
          echo "=== Critical configs ==="
          grep -E 'CONFIG_PID_NS|CONFIG_SYSVIPC|CONFIG_DEVTMPFS|CONFIG_POSIX_MQUEUE|CONFIG_IPC_NS|CONFIG_USER_NS|CONFIG_CGROUP_DEVICE' .config
          echo "=== Building ==="
          make -j$(nproc) Image 2>&1 | tail -50
          ls -la arch/arm64/boot/Image*
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: droidspaces-kernel-ums9230
          path: kernel/arch/arm64/boot/Image*
          if-no-files-found: error
          retention-days: 30